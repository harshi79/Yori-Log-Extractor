[project]
name = "yori-log-extractor"
version = "1.0.0"
description = "Telegram bot that stores logs and text on MantisBin and returns a shareable link"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["telegram", "bot", "logs", "pastebin", "mantisbin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Logging",
]
dependencies = [
    "python-telegram-bot>=21.6,<23",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
yori-log-extractor = "bot.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RET", "ARG"]
ignore = [
    "E501",   # long lines: the message templates read better unwrapped
    "UP045",  # Optional[X] reads better than X | None here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "PT011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
